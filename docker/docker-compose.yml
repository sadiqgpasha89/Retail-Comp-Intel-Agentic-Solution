version: "3.9"

services:
  retail-intel-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: retail-intel-api
    env_file:
      - ../.env
    environment:
      - EXECUTION_MODE=open_stack
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - retail-intel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: retail-intel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retail-intel-net
    volumes:
      - redis_data:/data

networks:
  retail-intel-net:
    driver: bridge

volumes:
  redis_data:

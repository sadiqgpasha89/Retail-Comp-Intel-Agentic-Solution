# Local development profile. Redis was removed: no code path used it (see docs/CAPABILITY_MATRIX.md, B-03
# for the queue/worker backlog item that will reintroduce a broker when workers exist).
services:
  retail-intel-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: retail-intel-api
    environment:
      - EXECUTION_MODE=open_stack
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - runtime_data:/app/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  runtime_data:
